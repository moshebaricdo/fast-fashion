# XcodeGen spec. The .xcodeproj is generated and git-ignored: run `xcodegen generate` in ios/.
name: FastFashion

options:
  bundleIdPrefix: com.fastfashion
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set your team locally (or via XcodeGen's --spec override) to run on a device.
    DEVELOPMENT_TEAM: ""

packages:
  OutfitEngine:
    path: Packages/OutfitEngine
  FastFashionKit:
    path: Packages/FastFashionKit

targets:
  FastFashion:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: OutfitEngine
        product: WardrobeCore
      - package: OutfitEngine
        product: OutfitEngine
      - package: FastFashionKit
        product: Persistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fastfashion.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FastFashion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FastFashion uses your approximate location to match outfits to today's weather.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  FastFashion:
    build:
      targets:
        FastFashion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OutfitEngine/WardrobeCoreTests
        - package: OutfitEngine/OutfitEngineTests
        - package: FastFashionKit/PersistenceTests
