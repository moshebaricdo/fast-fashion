name: OutfitEngine

on:
  push:
    branches: [main]
    paths:
      - "ios/Packages/OutfitEngine/**"
      - ".github/workflows/outfit-engine.yml"
  pull_request:
    paths:
      - "ios/Packages/OutfitEngine/**"
      - ".github/workflows/outfit-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/Packages/OutfitEngine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ios/Packages/OutfitEngine/.build
          key: swift-6.2-${{ runner.os }}-${{ hashFiles('ios/Packages/OutfitEngine/Package.swift', 'ios/Packages/OutfitEngine/Package.resolved') }}
          restore-keys: swift-6.2-${{ runner.os }}-

      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build
